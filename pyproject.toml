[project]
name = "crcc"
version = "0.1.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
    { name = "Cyber-Physical Systems Group - Technical University of Munich", email = "commonroad@lists.lrz.de" },
]
description = ""
keywords = []
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["commonroad-io>=2026.1"]

[dependency-groups]
dev = ["pre-commit>=2.21.0", "pyright==1.1.411", "pytest>=8.0", "ruff==0.14.8"]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python_bindings", "parry", "rhusics", "collide"]
module-name = "crcc._core"
python-packages = ["crcc"]
python-source = "python"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
]

[tool.cibuildwheel]
skip = ["*-musllinux*"]
environment = { PIP_DISABLE_PIP_VERSION_CHECK = "1" }
build-verbosity = 1

[tool.cibuildwheel.linux]
repair-wheel-command = [
    "auditwheel repair -w {dest_dir} {wheel}",
    # skip abi3audit for CPython 3.14 free-threaded wheels (no abi3 support yet)
    "if [[ \"{wheel}\" != *\"-cp314t-\"* ]]; then pipx run abi3audit --strict --report {wheel}; fi",
]
[tool.cibuildwheel.macos]
repair-wheel-command = [
    "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
    # skip abi3audit for CPython 3.14 free-threaded wheels (no abi3 support yet)
    "if [[ \"{wheel}\" != *\"-cp314t-\"* ]]; then pipx run abi3audit --strict --report {wheel}; fi",
]

[tool.ruff]
line-length = 120
indent-width = 4
format.quote-style = "double"
target-version = "py310"
[tool.ruff.lint]
ignore = ["E203", "PLR2004"]
select = [
    "E",
    "F",
    "W",    # Pycodestyle errors/warnings & Pyflakes
    "I",    # Import sorting
    "B",    # Bugbear (catches bugs & design flaws)
    "C4",   # Comprehension checks
    "UP",   # Pyupgrade (modern Python syntax)
    "SIM",  # Code simplification suggestions
    "ARG",  # Unused arguments
    "PTH",  # Use pathlib instead of os.path
    "PL",   # Pylint (refactoring, complexity, warnings)
    "PERF", # Performance checks
    "RUF",  # Ruff-native rules
]
isort.combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [
    "N802",
    "B008",
] # Allow PascalCase factory methods & default calls in Rust stub files
"tests/*" = [
    "PLC0415",
    "SLF001",
    "RUF043",
    "PLR0913",
] # Allow lazy imports, private member access, regex matches & helper arg count in test suite
"main.py" = ["PLC0415"] # Allow lazy action dispatcher imports
# ponytail: tools/ and examples/ keep bug-catching lints (E/F/B + ARG) but stay
# exempt from style pedantry; E501 lines are unbreakable report strings and B023
# lambdas are always invoked within their loop iteration.
"tools/*" = [
    "B023",
    "C4",
    "E501",
    "PERF",
    "PL",
    "PTH",
    "RUF",
    "SIM",
    "UP",
    "W",
]
"examples/*" = [
    "B023",
    "C4",
    "E501",
    "PERF",
    "PL",
    "PTH",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated.*:DeprecationWarning:google\\.protobuf\\.internal\\.well_known_types",
]

[tool.pyright]
include = ["python", "examples", "tools", "tests", "main.py"]
extraPaths = ["."]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportPrivateUsage = false
reportMissingParameterType = false
reportUnknownParameterType = false
reportAttributeAccessIssue = false
reportUnusedFunction = false
