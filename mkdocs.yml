# Stock MkDocs is enough until the documentation needs a concrete theme or plugin.
site_name: CRCC
site_description: 2D collision checking for Rust, Python, and CommonRoad
site_url: https://burakssen.com/crcc/
repo_url: https://github.com/burakssen/crcc

nav:
  - Home: index.md
  - Concepts and Engines: concepts.md
  - Engine Semantics: engine-semantics.md
  - Python:
      - Usage Guide: python-guide.md
      - API Reference: python-api.md
  - Rust:
      - Usage Guide: rust-guide.md
      - API Reference: rust-api.md
  - Architecture: architecture.md
  - Development and Benchmarks: development.md

markdown_extensions:
  - attr_list
  - tables
  - fenced_code

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css
