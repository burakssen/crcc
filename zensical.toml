[project]
site_name = "CRCC"
site_description = "2D collision checking for Rust, Python, and CommonRoad"
site_url = "https://burakssen.com/crcc/"
repo_url = "https://github.com/burakssen/crcc"
strict = true
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js",
]
nav = [
  "index.md",
  { "Get started" = [
    "getting-started/installation.md",
    "getting-started/quick-start.md",
  ] },
  { "Concepts" = [
    "concepts/geometry-and-poses.md",
    "concepts/scenes-and-time.md",
    "concepts/continuous-collision.md",
    "concepts/backends.md",
    "concepts/numerical-robustness.md",
  ] },
  { "Guides" = [
    "guides/pair-queries.md",
    "guides/scenes-and-trajectories.md",
    "guides/prepared-and-batch-queries.md",
    "guides/commonroad.md",
  ] },
  { "Reference" = [
    "reference/supported-features.md",
    "reference/python.md",
    "reference/rust.md",
    "reference/errors-and-limits.md",
    "reference/limitations.md",
    "reference/benchmark-artifacts.md",
  ] },
  { "Architecture" = [
    "architecture/overview.md",
    "architecture/query-pipeline.md",
    "architecture/backends-and-bindings.md",
  ] },
  { "Development" = [
    "development/repository-structure.md",
    "development/building-and-testing.md",
    "development/repository-tools.md",
    "development/benchmarking.md",
    "development/extending-backends.md",
    "development/extending-geometry.md",
    "development/python-bindings.md",
    "development/contributing.md",
  ] },
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.top",
  "search.suggest",
  "content.code.copy",
  "content.tabs.link",
]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
admonition = {}
tables = {}
pymdownx.details = {}
pymdownx.tabbed = { alternate_style = true }
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
