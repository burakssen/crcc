name: CI

on:
  push:
    branches:
      - main
    tags:
      # GitHub tag filters are globs; exact semantic versions are enforced before packaging.
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Run pre-commit
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
      - name: Run Pyright
        run: uv run --frozen pyright

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Cover no backend, each backend alone, and everything together with five commands.
      - name: Test feature configurations
        run: |
          cargo test --locked --no-default-features
          cargo test --locked --no-default-features --features parry
          cargo test --locked --no-default-features --features rhusics
          cargo test --locked --no-default-features --features collide
          cargo test --locked --all-features

  python:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ABI3 needs only the oldest and newest declared Python versions in routine CI.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build Python extension
        run: uv run --frozen --with "maturin>=1.0,<2.0" maturin develop
      - name: Run Python tests
        run: uv run --frozen pytest

  package:
    name: Package check
    needs: [quality, rust, python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify versions
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          def version(path: str) -> str:
              with Path(path).open("rb") as file:
                  return tomllib.load(file)["project" if path == "pyproject.toml" else "package"]["version"]

          python_version = version("pyproject.toml")
          rust_version = version("Cargo.toml")
          if python_version != rust_version:
              raise SystemExit(f"version mismatch: pyproject.toml={python_version}, Cargo.toml={rust_version}")

          tag = os.environ["RELEASE_TAG"]
          if tag and (not re.fullmatch(r"v\d+\.\d+\.\d+", tag) or tag[1:] != python_version):
              raise SystemExit(f"release tag {tag!r} does not match version {python_version!r}")
          PY
      - name: Build source distribution and Linux wheel
        run: |
          uv build --sdist
          uv build --wheel dist/*.tar.gz
      - name: Smoke-test wheel
        run: |
          uv venv /tmp/crcc-smoke
          uv pip install --python /tmp/crcc-smoke/bin/python dist/*.whl
          /tmp/crcc-smoke/bin/python -c "import crcc"
      - name: Prepare release source distribution
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir release
          cp dist/*.tar.gz release/crcc.tar.gz
      - name: Upload source distribution
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-distribution
          path: release/crcc.tar.gz
          if-no-files-found: error
          retention-days: 1

  wheels:
    name: Wheel (${{ matrix.artifact }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: windows-latest
            artifact: windows-x86_64
          - os: windows-11-arm
            artifact: windows-arm64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: macos-latest
            artifact: macos-arm64
    steps:
      - name: Download source distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: source-distribution
          path: dist
      - name: Unpack source distribution
        shell: bash
        run: |
          mkdir package
          tar -xzf dist/crcc.tar.gz --strip-components=1 -C package
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build and smoke-test wheel
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_BUILD: cp310-*
          CIBW_ARCHS: native
          CIBW_TEST_COMMAND: python -c "import crcc"
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- --default-toolchain stable --profile minimal -y
          CIBW_ENVIRONMENT_LINUX: PATH=$HOME/.cargo/bin:$PATH
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
        with:
          package-dir: package
          output-dir: wheelhouse
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - name: Restore versioned source distribution name
        run: mv dist/crcc.tar.gz "dist/crcc-${GITHUB_REF_NAME#v}.tar.gz"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
