[package]
name = "crcc"
version = "0.1.0"
edition = "2024"

[lib]
name = "crcc"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "crcc"
path = "src/main.rs"
required-features = ["rayon"]

[features]
default = ["parry", "parry-default-engine"]
parry = ["dep:parry2d-f64"]
default-engine = []
parry-default-engine = ["parry", "default-engine"]
python_bindings = ["dep:pyo3", "rayon"]
rayon = ["dep:rayon"]

[dependencies]
cfg-if = "1.0.4"
delegate = "0.13.5"
derive_more = { version = "2.1.1", features = ["add", "mul", "sum"] }
enum_dispatch = "0.3.13"
geo = "0.32.0"
glamx = "0.1.3"
itertools = "0.14.0"
parry2d-f64 = { version = "0.26.0", optional = true }
pyo3 = { version = "0.27.1", features = ["abi3-py310"], optional = true }
rayon = { version = "1.11.0", optional = true }
replace_with = "0.1.8"

[dev-dependencies]
rstest = "0.26.1"
