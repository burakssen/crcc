[package]
name = "crcc"
version = "0.1.0"
edition = "2024"

[lib]
name = "crcc"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "crcc"
path = "src/main.rs"
required-features = ["rayon"]

[features]
default = ["parry", "rhusics"]
parry = ["dep:parry2d-f64"]
rhusics = ["dep:rhusics-core"]
python_bindings = ["dep:pyo3", "rayon"]
rayon = ["dep:rayon"]

[dependencies]
derive_more = { version = "2.1.1", features = ["add", "mul", "sum"] }
enum_dispatch = "0.3.13"
geo = "0.32.0"
glamx = "0.1.3"
itertools = "0.14.0"
parry2d-f64 = { version = "0.26.0", optional = true }
rhusics-core = { version = "0.7.0", optional = true }
pyo3 = { version = "0.27.1", features = ["abi3-py310"], optional = true }
rayon = { version = "1.11.0", optional = true }
replace_with = "0.1.8"
cgmath = "0.16.0"
collision = "0.18.0"

[dev-dependencies]
rstest = "0.26.1"
